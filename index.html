<style>

  :root {
    --bg: #07080d; --bg2: #0e1018; --ink: #f2f3f7; --muted: #9aa0b4; --line: #262a3a;
    --glass: rgba(22, 25, 38, 0.62); --accent: #ffcb05;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(255,203,5,0.08), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(99,102,241,0.10), transparent 60%),
      var(--bg);
    min-height: 100vh;
  }
  .grid-bg {
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }
  .brutal { border: 2px solid #f2f3f7; box-shadow: 5px 5px 0 #f2f3f7; }
  .brutal-sm { border: 2px solid #f2f3f7; box-shadow: 3px 3px 0 #f2f3f7; }
  .brutal-btn { transition: transform .12s ease, box-shadow .12s ease; }
  .brutal-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #f2f3f7; }
  .brutal-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 #f2f3f7; }

  /* Type-driven card: --tc is set inline from the Pokémon's primary type */
  .poke-card {
    position: relative; border: 2px solid var(--tc); border-radius: 18px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 16%, rgba(18,20,30,.85)) 0%, rgba(14,16,24,.88) 45%);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 6px 6px 0 color-mix(in srgb, var(--tc) 70%, #000), 0 0 32px -6px color-mix(in srgb, var(--tc) 55%, transparent);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .poke-card:hover {
    transform: translate(-2px,-3px);
    box-shadow: 9px 9px 0 color-mix(in srgb, var(--tc) 70%, #000), 0 0 48px -4px color-mix(in srgb, var(--tc) 75%, transparent);
  }
  .poke-card .orb { position:absolute; inset:auto -40px -40px auto; width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--tc) 35%, transparent), transparent 70%); pointer-events:none; }
  .type-badge { font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; padding: 3px 9px; border-radius: 999px;
    border: 1.5px solid rgba(0,0,0,.45); box-shadow: 2px 2px 0 rgba(0,0,0,.55); color: #0b0b0f; }

  .tab-active { background: var(--accent); color: #0b0b0f; }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .stagger > * { animation: fadeIn .4s ease both; }
  .stagger > *:nth-child(2){animation-delay:.04s}.stagger > *:nth-child(3){animation-delay:.08s}
  .stagger > *:nth-child(4){animation-delay:.12s}.stagger > *:nth-child(5){animation-delay:.16s}
  .stagger > *:nth-child(6){animation-delay:.2s}.stagger > *:nth-child(7){animation-delay:.24s}
  select, input, textarea { background: #0e1018; color: var(--ink); }
  select option, select optgroup { background: #0e1018; color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #2a2f42; border-radius: 10px; }
  .dex-num { font-family: "JetBrains Mono", monospace; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  :root { color-scheme: dark; }
  body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; }
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.10), rgba(255,255,255,.04)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 10px; }

  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

class LLMError extends Error { constructor(code, message, status, extra) { super(message); this.code = code; this.status = status; Object.assign(this, extra || {}); } }

function parseJSONLoose(text) {
  if (!text) throw new LLMError('invalid_json', 'empty');
  let s = String(text).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) s = fence[1].trim();
  try { return JSON.parse(s); } catch {}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
  throw new LLMError('invalid_json', 'Could not parse JSON');
}

async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); }
  catch (e) { if (e.name === 'AbortError') throw new LLMError('cancelled', 'cancelled'); throw new LLMError('network', e.message || 'network'); }
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) {
    const msg = String(j?.error?.message || j?.message || j?.detail || `HTTP ${r.status}`);
    const details = Array.isArray(j?.error?.details) ? j.error.details : [];
    let retryMs = 0;
    const ri = details.find(d => /RetryInfo/.test(d['@type'] || ''));
    if (ri?.retryDelay) retryMs = Math.ceil(parseFloat(ri.retryDelay) * 1000) || 0;
    const ra = r.headers.get('retry-after'); if (!retryMs && ra && !isNaN(+ra)) retryMs = +ra * 1000;
    const m = msg.match(/try again in ([\d.]+)\s*(ms|s|m)/i); if (!retryMs && m) retryMs = parseFloat(m[1]) * (m[2] === 'ms' ? 1 : m[2] === 'm' ? 60000 : 1000);
    const quotaIds = details.flatMap(d => (d.violations || []).map(v => String(v.quotaId || v.quotaMetric || ''))).join(' ');
    const daily = /PerDay|per day|RPD|TPD|daily/i.test(quotaIds + ' ' + msg);
    let code = 'http';
    if (r.status === 429) code = daily ? 'quota_day' : 'rate_limited';
    else if (r.status === 503 || r.status === 500 || r.status === 502 || r.status === 504 || /high demand|overloaded|UNAVAILABLE/i.test(msg)) code = 'overloaded';
    else if (r.status === 401 || r.status === 403) code = 'auth';
    else if (r.status === 404) code = 'not_found';
    throw new LLMError(code, msg, r.status, { retryMs });
  }
  return j;
}

async function callGemini(cfg, prompt, { signal, search, model }) {
  const body = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2, maxOutputTokens: 32768 } };
  if (search) body.tools = [{ google_search: {} }]; else body.generationConfig.responseMimeType = 'application/json';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const j = await httpJSON(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': cfg.geminiKey }, body: JSON.stringify(body), signal });
  const cand = j?.candidates?.[0];
  const text = (cand?.content?.parts || []).map(p => p.text || '').join('');
  if (!text) throw new LLMError('empty', cand?.finishReason || 'empty response');
  const sources = (cand?.groundingMetadata?.groundingChunks || []).map(c => c.web).filter(Boolean).map(w => ({ title: w.title || w.uri, url: w.uri }));
  return { text, sources, truncated: cand?.finishReason === 'MAX_TOKENS' };
}

async function callGroq(cfg, prompt, { signal, search, model }) {
  const body = { model, messages: [{ role: 'user', content: prompt }], temperature: 0.2, max_completion_tokens: 8192 };
  if (search) body.tools = [{ type: 'browser_search' }]; else body.response_format = { type: 'json_object' };
  const j = await httpJSON('https://api.groq.com/openai/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + cfg.groqKey }, body: JSON.stringify(body), signal });
  const msg = j?.choices?.[0]?.message;
  const text = msg?.content || '';
  if (!text) throw new LLMError('empty', 'empty response');
  const sources = [];
  (msg?.executed_tools || []).forEach(tl => (tl?.search_results?.results || []).forEach(r => r?.url && sources.push({ title: r.title || r.url, url: r.url })));
  return { text, sources, truncated: j?.choices?.[0]?.finish_reason === 'length' };

const SEARCH_REFUSED = {};
const EXHAUSTED = {};
const OVERLOADED = {};           /* model -> time it last answered "high demand" */
const LAST_OK = { key: '' };            /* model -> time its daily quota ran out (skip for this session) */
const sleep = (ms, signal) => new Promise((res, rej) => { const id = setTimeout(res, ms); signal?.addEventListener('abort', () => { clearTimeout(id); rej(new LLMError('cancelled', 'cancelled')); }, { once: true }); });

/* Build the ordered list of (provider, model) attempts: chosen provider's models, then the other provider as backup */
function attemptChain(cfg) {
  const gem = cfg.geminiKey ? modelList(cfg.geminiModels).map(m => ({ provider: 'gemini', model: m })) : [];
  const grq = cfg.groqKey ? modelList(cfg.groqModels).map(m => ({ provider: 'groq', model: m })) : [];
  let chain = cfg.provider === 'groq' ? [...grq, ...(cfg.backup ? gem : [])] : [...gem, ...(cfg.backup ? grq : [])];
  chain = chain.filter(a => !EXHAUSTED[a.provider + ':' + a.model]);
  /* the model that last answered goes first; models that were overloaded in the last 5 minutes go last */
  const k = (a) => a.provider + ':' + a.model, now = Date.now();
  const rank = (a) => k(a) === LAST_OK.key ? -1 : (OVERLOADED[k(a)] && now - OVERLOADED[k(a)] < 300000) ? 1 : 0;
  return chain.map((a, i) => ({ a, i })).sort((x, y) => rank(x.a) - rank(y.a) || x.i - y.i).map(x => x.a);
}

/* One JSON call. Tries each model in turn on overload / quota errors, waits once on a short per-minute limit. */
async function askJSON(cfg, prompt, { signal, useSearch = true, sampleFn, onAttempt } = {}) {
  if (cfg.provider === 'claude') {
    if (!sampleFn) throw new LLMError('no_provider', 'Claude not available');
    try { return { json: await sampleFn.json(prompt, { modelTier: 'complex', signal }), sources: [], note: '', used: 'Claude' }; }
    catch (e) { throw new LLMError(e?.code === 'rate_limited' ? 'rate_limited' : e?.code || 'http', e?.message || 'Claude error'); }
  }
  const chain = attemptChain(cfg);
  if (!chain.length) throw new LLMError(Object.keys(EXHAUSTED).length ? 'quota_day' : 'no_provider', 'no model left');
  let lastErr = null, note = '';
  for (const a of chain) {
    const call = a.provider === 'groq' ? callGroq : callGemini;
    const label = `${a.provider === 'groq' ? 'Groq' : 'Gemini'} · ${a.model}`;
    const wantSearch = useSearch && (a.provider === 'groq' ? cfg.groqSearch : cfg.geminiSearch) && !SEARCH_REFUSED[a.provider];
    let waited = false;
    for (let tries = 0; tries < 3; tries++) {
      onAttempt?.(label);
      try {
        const res = await call(cfg, prompt, { signal, search: wantSearch && tries === 0, model: a.model });
        const json = parseJSONLoose(res.text); LAST_OK.key = a.provider + ':' + a.model; delete OVERLOADED[LAST_OK.key];
        return { json, sources: res.sources, note, used: label, truncated: res.truncated };
      } catch (e) {
        if (e.code === 'cancelled' || e.code === 'auth') throw e;
        lastErr = e;
        if (wantSearch && tries === 0 && (e.code === 'http' || e.code === 'not_found')) { SEARCH_REFUSED[a.provider] = true; note = 'search_off'; continue; }
        if (e.code === 'invalid_json' && tries === 0) continue;                          /* one re-ask on malformed JSON */
        if (e.code === 'rate_limited' && !waited && e.retryMs && e.retryMs <= 45000) {  /* short per-minute limit: wait once */
          waited = true; onAttempt?.(`${label} · ${Math.ceil(e.retryMs / 1000)}s…`); await sleep(e.retryMs + 500, signal); continue;
        }
        if (e.code === 'quota_day') EXHAUSTED[a.provider + ':' + a.model] = Date.now();
        if (e.code === 'overloaded') OVERLOADED[a.provider + ':' + a.model] = Date.now();
        break;                                                                            /* overloaded / quota / not found → next model */
      }
    }
  }
  throw lastErr || new LLMError('http', 'all models failed');
}

const paMem = new Map();
async function paGet(path, signal) {
  const url = path.startsWith('http') ? path : PA + path;
  if (paMem.has(url)) return paMem.get(url);
  const p = (async () => {
    let r; try { r = await fetch(url, { signal }); } catch (e) { throw new LLMError(e.name === 'AbortError' ? 'cancelled' : 'pa_network', 'PokéAPI unreachable'); }
    if (r.status === 404) return null;

    return r.json();
  })();

}
/* small persistent cache of trimmed results */
const paCacheGet = (k) => lsGet('pa:' + k, null);
const paCacheSet = (k, v) => lsSet('pa:' + k, v);

function slugCandidates(name) {
  let n = String(name || '').trim();
  const forms = [['Alolan ', '-alola'], ['Galarian ', '-galar'], ['Hisuian ', '-hisui'], ['Paldean ', '-paldea']];
  let suffix = '';
  for (const [pre, suf] of forms) if (n.startsWith(pre)) { n = n.slice(pre.length); suffix = suf; }
  const base = n.toLowerCase().replace(/♀/g, '-f').replace(/♂/g, '-m').replace(/[éè]/g, 'e').replace(/[’'.:%]/g, '').trim().replace(/\s+/g, '-');
  return suffix ? [base + suffix, base] : [base];
}

/* Resolve a Pokémon and trim its data to one version group */
async function paPokemon(name, gameId, signal) {
  const map = GAME_PA[gameId]; if (!map) return null;
  const ck = 'pk:' + normKey(name) + ':' + gameId; const cached = paCacheGet(ck); if (cached) return cached;
  let pk = null;
  for (const slug of slugCandidates(name)) {
    pk = await paGet('pokemon/' + slug, signal);
    if (pk) break;
    const sp = await paGet('pokemon-species/' + slug, signal);
    const def = sp?.varieties?.find(v => v.is_default)?.pokemon?.url;
    if (def) { pk = await paGet(def, signal); if (pk) break; }
  }
  if (!pk) return null;
  const species = await paGet(pk.species.url, signal);
  const vgs = new Set(map.vg);
  const moves = [];
  for (const m of pk.moves || []) {
    const d = (m.version_group_details || []).filter(x => vgs.has(x.version_group.name)).map(x => [x.move_learn_method.name, x.level_learned_at]);
    if (d.length) moves.push({ n: m.move.name, d });
  }
  const trimmed = {
    id: pk.id, name: pk.name, dex: species?.id || pk.id,
    types: pk.types.map(t => t.type.name), pastTypes: (pk.past_types || []).map(p => ({ g: GEN_NUM[p.generation.name] || 0, t: p.types.map(t => t.type.name) })),
    abilities: pk.abilities.map(a => ({ n: a.ability.name, h: a.is_hidden, s: a.slot })),
    pastAbilities: (pk.past_abilities || []).map(p => ({ g: GEN_NUM[p.generation.name] || 0, a: p.abilities.map(a => ({ n: a.ability?.name || null, h: a.is_hidden, s: a.slot })) })),
    evolvesFrom: species?.evolves_from_species?.name || null, hasVG: moves.length > 0, moves
  };
  paCacheSet(ck, trimmed);
  return trimmed;
}

function typesForGen(p, gen) {
  const past = (p.pastTypes || []).filter(x => gen <= x.g).sort((a, b) => a.g - b.g)[0];
  return past ? past.t : p.types;
}
function abilitiesForGen(p, gen) {
  let list = p.abilities.map(a => ({ ...a }));
  (p.pastAbilities || []).filter(x => gen <= x.g).sort((a, b) => b.g - a.g).forEach(x => {
    x.a.forEach(pa => { list = list.filter(a => a.s !== pa.s); if (pa.n) list.push(pa); });
  });
  if (gen < 5) list = list.filter(a => !a.h);
  return list;
}

async function paMachine(moveName, gameId, signal) {

  const m = (mv?.machines || []).find(x => vgs.has(x.version_group.name));
  let label = '';
  if (m) { const mc = await paGet(m.machine.url, signal); label = String(mc?.item?.name || '').toUpperCase(); }

const ENC_METHOD = { walk: T('cỏ / hang', 'grass / cave'), surf: T('lướt sóng', 'surfing'), 'old-rod': T('Cần Câu Cũ', 'Old Rod'), 'good-rod': T('Cần Câu Tốt', 'Good Rod'),
  'super-rod': T('Cần Câu Siêu', 'Super Rod'), gift: T('quà tặng', 'gift'), 'gift-egg': T('trứng quà tặng', 'gift egg'), 'rock-smash': T('đập đá', 'Rock Smash'),
  headbutt: T('húc cây', 'Headbutt'), 'only-one': T('gặp một lần', 'one-time encounter') };
async function paEncounters(p, gameId, signal) {
  const ck = 'en:' + p.name + ':' + gameId; const c = paCacheGet(ck); if (c) return c;
  const versions = new Set(GAME_PA[gameId].v); const out = [];
  let cur = p, hops = 0;
  while (cur && hops < 3) {
    const list = await paGet(`pokemon/${cur.id}/encounters`, signal) || [];
    for (const e of list) for (const vd of e.version_details || []) {
      if (!versions.has(vd.version.name)) continue;
      for (const d of vd.encounter_details || []) out.push({ who: cur.name, area: e.location_area.name, min: d.min_level, max: d.max_level, method: d.method.name, version: vd.version.name });
    }
    if (!cur.evolvesFrom) break;
    cur = await paPokemon(cur.evolvesFrom, gameId, signal); hops++;
  }
  out.sort((a, b) => a.min - b.min);
  const seen = new Set(); const top = [];
  for (const o of out) { const k = o.who + o.area; if (seen.has(k)) continue; seen.add(k); top.push(o); if (top.length >= 3) break; }
  paCacheSet(ck, top); return top;
}
const prettyArea = (a) => prettyName(String(a).replace(/-area$/, '').replace(/^(kanto|johto|hoenn|sinnoh|unova|kalos|alola|galar|paldea|hisui)-/, ''));

/* Verify one Pokémon in place. Returns { bad: [moveIndex...] } */
async function verifyMon(mon, game, signal) {
  const gen = Number(game.gen) || 9;
  const gid = game.paId || game.id;
  const p = await paPokemon(mon.name, gid, signal);
  if (!p) { mon.verify = { status: 'unknown' }; return { bad: [] }; }
  mon.dex = p.dex || mon.dex;
  mon.types = typesForGen(p, gen);
  const v = { status: p.hasVG ? 'ok' : 'novg', paName: p.name, moves: [], ability: null, loc: null };
  if (!p.hasVG) { mon.verify = v; return { bad: [] }; }
  const bad = [];
  for (let i = 0; i < (mon.moves || []).length; i++) {
    const mv = mon.moves[i]; const key = normKey(mv.name?.en);
    const hit = p.moves.find(m => normKey(m.n) === key);
    if (!hit) { v.moves[i] = 'bad'; bad.push(i); continue; }
    const by = Object.fromEntries(hit.d.map(([m, l]) => [m, l]));
    let k, val = '';
    const prefer = mv.method?.k;
    if (prefer === 'tm' || prefer === 'hm') { if ('machine' in by) k = 'machine'; }
    if (!k) k = ['level-up', 'machine', 'tutor', 'egg'].find(x => x in by) || hit.d[0][0];
    if (k === 'level-up') { const lv = Math.min(...hit.d.filter(d => d[0] === 'level-up').map(d => d[1])); mv.method = { k: lv <= 1 ? 'level' : 'level', v: lv <= 1 ? 'Lv. 1' : 'Lv. ' + lv }; }
    else if (k === 'machine') { val = await paMachine(hit.n, gid, signal); mv.method = { k: /^HM/.test(val) ? 'hm' : 'tm', v: val || 'TM' }; }
    else if (k === 'tutor') mv.method = { k: 'tutor', v: 'Tutor' };
    else if (k === 'egg') mv.method = { k: 'egg', v: 'Egg' };
    else mv.method = { k: 'other', v: prettyName(k) };
    const t = await paMoveType(hit.n, signal); if (t && gen >= 2) mv.type = (gen < 6 && t === 'fairy') ? mv.type : t;
    v.moves[i] = 'ok';
  }
  if (gen >= 3 && mon.ability) {
    const valid = abilitiesForGen(p, gen);
    const ok = valid.some(a => normKey(a.n) === normKey(mon.ability.name?.en));
    v.ability = { ok, valid: valid.map(a => prettyName(a.n) + (a.h ? ' (HA)' : '')) };
  }
  try {
    const enc = await paEncounters(p, gid, signal);
    v.loc = enc.length ? enc.map(e => ({ who: prettyName(e.who), area: prettyArea(e.area), lv: e.min === e.max ? `Lv. ${e.min}` : `Lv. ${e.min}–${e.max}`, method: ENC_METHOD[e.method] || T(prettyName(e.method), prettyName(e.method)) })) : [];
  } catch (e) { if (e.code === 'cancelled') throw e; v.loc = null; }
  mon.verify = v;
  return { bad, p };
}

/* Legal-move digest for the repair prompt */
function learnsetDigest(p) {
  const lv = [], tm = [], tu = [];
  for (const m of p.moves) for (const [k, l] of m.d) { if (k === 'level-up') lv.push(`${prettyName(m.n)} (Lv ${l})`); else if (k === 'machine') tm.push(prettyName(m.n)); else if (k === 'tutor') tu.push(prettyName(m.n)); }
  return `Level-up: ${[...new Set(lv)].join(', ')}\nTM/HM: ${[...new Set(tm)].join(', ')}\nTutor: ${[...new Set(tu)].join(', ') || '—'}`;
}

function repairPrompt(game, phaseKey, items) {
  return `${COMMON_RULES(game)}

Some moves you chose for the "${phaseKey}" phase CANNOT be learned in Pokémon ${game.name} according to PokéAPI. For each listed slot, pick a replacement from that Pokémon's LEGAL learnset below that fits its role and that it can realistically have during this phase.
${items.map(it => `### ${it.name}\nRole: ${it.role}\nKeep: ${it.keep.join(', ') || '—'}\nReplace: ${it.badMoves.join(', ')}\n${it.digest}`).join('\n\n')}

Reply with ONLY one JSON object: {"fixes": [{"name": "Monferno", "replace": "Fire Punch", "with": {"vi": "Bánh Xe Lửa", "en": "Flame Wheel"}, "type": "fire"}]}. Use the official English move name in "with.en" exactly as in the legal list.`;
}

function Coverage({ team, lang, t }) {
  const counts = useMemo(() => { const c = {}; team.forEach(m => (m.types||[]).forEach(ty => c[ty] = (c[ty]||0) + 1)); return Object.entries(c).sort((a,b) => b[1]-a[1]); }, [team]);
  const total = counts.reduce((s, [,n]) => s + n, 0) || 1;
  if (!counts.length) return null;
  return (
    <div>
      <div className="text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--muted)] mb-2">{t.coverage}</div>
      <div className="flex h-3.5 rounded-full overflow-hidden border-2 border-white/80">{counts.map(([ty, n]) => <div key={ty} title={`${one(TYPE_NAMES[ty], lang)} ×${n}`} style={{ width: `${n/total*100}%`, background: tc(ty) }} />)}</div>
      <div className="flex flex-wrap gap-1.5 mt-2">{counts.map(([ty, n]) => <span key={ty} className="chip bg-white/5 border border-white/10" style={{ color: tc(ty) }}>{one(TYPE_NAMES[ty], lang)} ×{n}</span>)}</div>
    </div>
  );
}

/* ---------- verification marks ---------- */
function VMark({ state, t }) {
  if (state === 'ok') return <span title={t.vOk} aria-label={t.vOk} className="chip" style={{ background:'#163a24', color:'#7ff0a3', padding:'1px 5px' }}>✓</span>;
  if (state === 'bad') return <span title={t.vBad} aria-label={t.vBad} className="chip" style={{ background:'#3d1717', color:'#ff9a9a', padding:'1px 5px' }}>✗</span>;
  return null;
}

/* ---------- Generation progress panel ---------- */
function GenPanel({ gen, t, onStop, onRetry }) {
  const steps = [['research', t.gen_research], ['plan', t.gen_plan], ['early', `${t.gen_phase} · ${t.phases.early}`], ['mid', `${t.gen_phase} · ${t.phases.mid}`], ['end', `${t.gen_phase} · ${t.phases.end}`]];
  const running = Object.values(gen.steps).some(s => s === 'run' || s === 'verify');
  const failed = Object.values(gen.steps).some(s => s === 'err');
  const map = { wait:[t.gen_wait,'#24262f','#c9ccd8'], run:[t.gen_run,'#3d2b0e','#ffcf7a'], verify:[t.gen_verify,'#14284a','#8db8ff'], done:[t.gen_done,'#163a24','#7ff0a3'], err:[t.gen_err,'#3d1717','#ff9a9a'], skip:[t.gen_skip,'#24262f','#7d8194'] };
  return (
    <section className="mt-6 glass brutal rounded-2xl p-4 sm:p-5 fade-in" aria-live="polite">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2.5">
          {running ? <span className="w-5 h-5 rounded-full border-[3px] border-[var(--accent)] border-t-transparent spin" /> : failed ? <span className="text-red-300"><Icon d={IC.alert} className="w-5 h-5" /></span> : <span className="text-green-300"><Icon d={IC.check} className="w-5 h-5" /></span>}
          <h2 className="font-black text-lg">{t.gen_title}</h2>
          {gen.provider ? <span className="chip bg-white/10">{gen.provider}</span> : null}
        </div>
        <div className="flex gap-2">
          {running ? <button onClick={onStop} className="rounded-xl px-3.5 py-2 font-bold border-2 border-white/40 hover:bg-white/5">{t.stop}</button> : null}
          {!running && failed ? <button onClick={onRetry} className="brutal-sm brutal-btn rounded-xl px-3.5 py-2 font-black bg-[var(--accent)] text-[#0b0b0f] flex items-center gap-1.5"><Icon d={IC.refresh} />{t.retry}</button> : null}
        </div>
      </div>
      <ol className="mt-4 grid gap-2 sm:grid-cols-2">
        {steps.map(([k, label]) => { const [l, bg, fg] = map[gen.steps[k]] || map.wait; return (
          <li key={k} className="flex items-center gap-3 rounded-xl px-3 py-2.5 bg-black/30 border border-white/10 min-w-0">
            <span className="flex-1 min-w-0 text-[13.5px] font-semibold truncate">{label}</span>
            {gen.info?.[k] ? <span className="dex-num text-[11px] text-[var(--muted)] tabular-nums">{gen.info[k]}</span> : null}
            <span className="chip" style={{ background: bg, color: fg }}>{l}</span>
          </li>); })}
      </ol>
      {running && gen.attempt ? <p className="mt-3 text-[12.5px] text-[#ffcf7a] dex-num break-words">→ {gen.attempt}</p> : null}
      {gen.error ? <p className="mt-3 text-[13.5px] font-semibold text-red-300 break-words">{gen.error}</p> : <p className="mt-3 text-[12.5px] text-[var(--muted)]">{t.gen_note}</p>}
    </section>
  );
}

/* ---------- AI settings modal ---------- */
function SettingsModal({ open, onClose, cfg, onSave, t, claudeAvailable }) {
  const [f, setF] = useState(cfg); const [models, setModels] = useState([]); const [msg, setMsg] = useState('');
  const [fileMsg, setFileMsg] = useState(''); const cfgFileRef = useRef(null);
  const exportCfg = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ _type: CFG_FILE_TAG, savedAt: new Date().toISOString(), config: f }, null, 2)], { type: 'application/json' }));
    a.download = 'pokemon-team-planner-config.json'; a.click();
  };
  const importCfg = (e) => {
    const file = e.target.files?.[0]; if (!file) return; const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); const c = j?._type === CFG_FILE_TAG ? j.config : j;
      if (!c || typeof c !== 'object' || !('provider' in c)) throw 0; setF({ ...DEFAULT_CFG, ...c }); setFileMsg(t.cfg.fileLoaded); } catch { setFileMsg(t.cfg.fileBad); } };
    r.readAsText(file); e.target.value = '';
  };

  const loadModels = async () => {
    setMsg('…');
    try {
      const list = await listGeminiModels(f.geminiKey); setModels(list);
      const flash = list.filter(m => /flash/.test(m) && !/exp/.test(m));
      /* stable before preview; Flash before Flash-Lite within the same version; newest first */
      const ver = (m) => parseFloat((m.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0);
      flash.sort((a, b) => (/preview/.test(a) - /preview/.test(b)) || (ver(b) - ver(a)) || (/lite/.test(a) - /lite/.test(b)));
      if (flash.length) setF(x => ({ ...x, geminiModels: flash.slice(0, 6).join(', ') }));
      setMsg(`${list.length} ${c.models}: ${list.join(', ')}`);
    } catch (e) { setMsg(e.message); }
  };
  const Toggle = ({ k, label, note }) => (
    <label className="flex gap-3 items-start cursor-pointer">
      <input id={'cfg-' + k} type="checkbox" checked={!!f[k]} onChange={e => setF({ ...f, [k]: e.target.checked })} className="mt-1 w-4 h-4 accent-[#ffcb05]" />
      <span className="text-[13px]"><span className="font-semibold">{label}</span><br /><span className="text-[var(--muted)] text-[12px]">{note}</span></span>
    </label>
  );
  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/70 backdrop-blur-sm fade-in" onClick={onClose}>
      <form className="glass brutal rounded-2xl w-full max-w-xl p-5 max-h-[92vh] overflow-auto" onClick={e => e.stopPropagation()} onSubmit={e => { e.preventDefault(); onSave(f); }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-xl font-black">{c.title}</h2>
          <button type="button" onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/10" aria-label={c.cancel}><Icon d={IC.x} className="w-5 h-5" /></button>
        </div>
        <div className="grid gap-4">
          <fieldset className="grid gap-2">
            <legend className="text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--muted)] mb-1">{c.provider}</legend>
            {[['gemini', c.gemini], ['groq', c.groq], ...(claudeAvailable ? [['claude', c.claude]] : [])].map(([k, l]) => (
              <label key={k} className={`flex items-center gap-3 rounded-xl px-3 py-2.5 border-2 cursor-pointer ${f.provider === k ? 'border-[var(--accent)] bg-[#ffcb05]/10' : 'border-white/20'}`}>
                <input type="radio" name="provider" checked={f.provider === k} onChange={() => setF({ ...f, provider: k })} className="accent-[#ffcb05]" /><span className="font-bold">{l}</span>
              </label>
            ))}
          </fieldset>
          {f.provider === 'gemini' ? (
            <div className="grid gap-3 rounded-xl p-3 border border-white/15">
              <label className="grid gap-1 text-[13px] font-semibold">{c.key} · <a className="text-[#8db8ff] underline" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">{c.getKey} ↗</a>
                <input id="cfg-gkey" type="password" autoComplete="off" className={field} value={f.geminiKey} onChange={e => setF({ ...f, geminiKey: e.target.value.trim() })} placeholder="AIza…" /></label>
              <label className="grid gap-1 text-[13px] font-semibold">{c.models_order}
                <div className="flex gap-2 items-start">
                  <textarea id="cfg-gmodels" rows={2} className={field} value={f.geminiModels} onChange={e => setF({ ...f, geminiModels: e.target.value })} />
                  <button type="button" onClick={loadModels} disabled={!f.geminiKey} className="shrink-0 rounded-xl px-3 py-2 border-2 border-white/40 font-bold text-[12px] disabled:opacity-40">{c.loadModels}</button>
                </div>
                <span className="text-[12px] font-normal text-[var(--muted)]">{c.models_hint}</span>
                {msg ? <span className="text-[12px] font-normal text-[var(--muted)] break-words">{msg}</span> : null}
              </label>
              <Toggle k="geminiSearch" label={c.search} note={c.geminiSearchNote} />
            </div>
          ) : f.provider === 'groq' ? (
            <div className="grid gap-3 rounded-xl p-3 border border-white/15">
              <label className="grid gap-1 text-[13px] font-semibold">{c.key} · <a className="text-[#8db8ff] underline" href="https://console.groq.com/keys" target="_blank" rel="noopener">{c.getKey} ↗</a>
                <input id="cfg-qkey" type="password" autoComplete="off" className={field} value={f.groqKey} onChange={e => setF({ ...f, groqKey: e.target.value.trim() })} placeholder="gsk_…" /></label>
              <label className="grid gap-1 text-[13px] font-semibold">{c.models_order}<input id="cfg-qmodels" className={field} value={f.groqModels} onChange={e => setF({ ...f, groqModels: e.target.value })} /></label>
              <Toggle k="groqSearch" label={c.search} note={c.groqSearchNote} />
            </div>
          ) : null}
          {f.provider !== 'claude' ? (
            <div className="grid gap-3 rounded-xl p-3 border border-dashed border-white/25">
              <Toggle k="backup" label={c.backup} note={c.backupNote} />
              {f.backup ? (f.provider === 'gemini'
                ? <label className="grid gap-1 text-[13px] font-semibold">Groq {c.key} · <a className="text-[#8db8ff] underline" href="https://console.groq.com/keys" target="_blank" rel="noopener">{c.getKey} ↗</a>
                    <input id="cfg-qkey2" type="password" autoComplete="off" className={field} value={f.groqKey} onChange={e => setF({ ...f, groqKey: e.target.value.trim() })} placeholder="gsk_…" /></label>
                : <label className="grid gap-1 text-[13px] font-semibold">Gemini {c.key} · <a className="text-[#8db8ff] underline" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">{c.getKey} ↗</a>
                    <input id="cfg-gkey2" type="password" autoComplete="off" className={field} value={f.geminiKey} onChange={e => setF({ ...f, geminiKey: e.target.value.trim() })} placeholder="AIza…" /></label>) : null}
            </div>
          ) : null}
          <label className="grid gap-1 text-[13px] font-semibold">{c.tavily} · <a className="text-[#8db8ff] underline" href="https://app.tavily.com" target="_blank" rel="noopener">{c.getKey} ↗</a>
            <input id="cfg-tkey" type="password" autoComplete="off" className={field} value={f.tavilyKey} onChange={e => setF({ ...f, tavilyKey: e.target.value.trim() })} placeholder="tvly-…" />
            <span className="text-[12px] font-normal text-[var(--muted)]">{c.tavilyNote}</span></label>
          <div className="grid gap-2 rounded-xl p-3 border border-white/15">
            <div className="text-[12.5px]"><span className="text-[var(--muted)]">{c.savedFor} </span><span className="dex-num font-bold break-all">{location.protocol === 'file:' ? 'file://' : location.origin}</span></div>
            <p className="text-[12px] text-[var(--muted)]">{c.originNote}</p>
            {!storageWorks ? <p className="text-[12.5px] font-semibold text-[#ff9a9a]">{t.storageOff}</p> : null}
            <div className="flex flex-wrap gap-2">
              <button type="button" onClick={exportCfg} className="rounded-xl px-3 py-2 border-2 border-white/40 font-bold text-[12.5px] inline-flex items-center gap-1.5"><Icon d={IC.down} className="w-3.5 h-3.5" />{c.exportCfg}</button>
              <button type="button" onClick={() => cfgFileRef.current?.click()} className="rounded-xl px-3 py-2 border-2 border-white/40 font-bold text-[12.5px] inline-flex items-center gap-1.5"><Icon d={IC.up} className="w-3.5 h-3.5" />{c.importCfg}</button>
              <input ref={cfgFileRef} type="file" accept="application/json,.json" className="hidden" onChange={importCfg} />
            </div>
            {fileMsg ? <p className="text-[12.5px] font-semibold text-[#7ff0a3]">{fileMsg}</p> : null}
            <p className="text-[12px] text-[#ffcf7a]">{c.fileWarn}</p>
          </div>
          <p className="text-[12px] text-[var(--muted)] border-l-4 border-white/20 pl-3">{c.privacy}</p>
          <div className="flex gap-3 justify-end">
            <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl border-2 border-white/40 font-bold hover:bg-white/5">{c.cancel}</button>
            <button type="submit" className="brutal-sm brutal-btn px-4 py-2.5 rounded-xl font-black bg-[var(--accent)] text-[#0b0b0f]">{c.save}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
const PHASES = ['early', 'mid', 'end'];
const cfgReady = (c) => c.provider === 'gemini' ? !!c.geminiKey : c.provider === 'groq' ? !!c.groqKey : c.provider === 'claude';
const providerLabel = (c) => c.provider === 'gemini' ? `Gemini · ${modelList(c.geminiModels)[0] || ''}` : c.provider === 'groq' ? `Groq · ${modelList(c.groqModels)[0] || ''}` : 'Claude';
const clone = (o) => JSON.parse(JSON.stringify(o));

function App() {
  const prefs = lsGet(LS_PREFS, {});
  const [lang, setLang] = useState(prefs.lang || 'vi');
  const [gameId, setGameId] = useState(prefs.gameId || 'platinum');
  const [phase, setPhase] = useState(prefs.phase || 'early');
  const [starters, setStarters] = useState(prefs.starters || { platinum: 'Chimchar' });
  const [cfg, setCfg] = useState(loadCfg);
  const [customGames, setCustomGames] = useState(() => lsGet(LS_GAMES, []));
  const [dataMap, setDataMap] = useState(() => lsGet(LS_DATA, {}));
  const [gens, setGens] = useState({});
  const [modal, setModal] = useState(false);
  const [cfgOpen, setCfgOpen] = useState(false);
  const [toast, setToast] = useState('');
  const [armRemove, setArmRemove] = useState(false);
  const [verifying, setVerifying] = useState(false);
  const [claudeSample, setClaudeSample] = useState(null);
  const fileRef = useRef(null);
  const ctlRef = useRef({});
  const dataRef = useRef(dataMap); dataRef.current = dataMap;
  const autoStarted = useRef({});
  const t = UI[lang];

  useEffect(() => { const c = window.claude; if (c && typeof c.use === 'function') c.use('sample').then(s => s && setClaudeSample(() => s)).catch(() => {}); }, []);
  useEffect(() => { lsSet(LS_PREFS, { lang, gameId, phase, starters }); document.documentElement.lang = lang; }, [lang, gameId, phase, starters]);
  useEffect(() => { lsSet(LS_GAMES, customGames); }, [customGames]);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(''), 3000); return () => clearTimeout(id); }, [toast]);
  useEffect(() => { setArmRemove(false); }, [gameId]);

  const allGames = useMemo(() => [...BASE_GAMES, ...customGames.filter(g => !BASE_GAMES.some(b => b.id === g.id))], [customGames]);
  const game = allGames.find(g => g.id === gameId) || BASE_GAMES.find(g => g.id === 'platinum');
  const starterList = (game.starters?.length ? game.starters : STARTERS[game.id]) || [];
  const starter = starters[game.id] || (starterList.length === 1 ? starterList[0].name : '');
  const chosen = starter && starter !== 'auto' ? starter : '';
  const keyFor = (gid, s) => s && s !== 'auto' ? `${gid}::${normKey(s)}` : gid;
  const dk = keyFor(game.id, starter);
  const job = useMemo(() => ({ ...game, id: dk, paId: game.id, starter: chosen }), [game, dk, chosen]);
  const builtinFor = (s) => { const b = BUILTIN_DATA[game.id]; return b && normKey(b.starter) === normKey(s) ? b : null; };
  const builtin = builtinFor(starter);
  const needsPick = starterList.length > 1 && !starter;
  const data = needsPick ? null : (dataMap[dk] || builtin || null);
  const gen = gens[dk];
  const pickStarter = (s) => setStarters(m => ({ ...m, [game.id]: s }));
  const cachedStarter = (s) => !!(dataMap[keyFor(game.id, s)] || builtinFor(s));

  const putData = (id, d) => { dataRef.current = { ...dataRef.current, [id]: d }; setDataMap(m => ({ ...m, [id]: d })); const all = lsGet(LS_DATA, {}); all[id] = d; lsSet(LS_DATA, all); };
  const dropData = (id) => { const n = { ...dataRef.current }; delete n[id]; dataRef.current = n; setDataMap(n); const all = lsGet(LS_DATA, {}); delete all[id]; lsSet(LS_DATA, all); };
  const setGen = (id, fn) => setGens(g => ({ ...g, [id]: fn(g[id] || { steps:{ research:'wait', plan:'wait', early:'wait', mid:'wait', end:'wait' }, info:{}, error:'' }) }));
  const step = (id, k, s, info) => setGen(id, g => ({ ...g, steps: { ...g.steps, [k]: s }, info: info !== undefined ? { ...g.info, [k]: info } : g.info }));
  const errCopy = (e) => { const m = t.err[e?.code]; if (e?.code === 'http') return m + (e.message || ''); return m || (t.err.http + (e?.message || '')); };

  /* verify + repair one phase's team in place */
  const verifyTeam = async (g, team, key, signal, allowRepair) => {
    const bads = [];
    for (const mon of team) {
      try { const r = await verifyMon(mon, g, signal); if (r.bad.length && r.p) bads.push({ mon, idx: r.bad, p: r.p }); }
      catch (e) { if (e.code === 'cancelled') throw e; mon.verify = { status: 'offline' }; }
    }
    if (allowRepair && bads.length && cfgReady(cfg)) {
      const items = bads.map(b => ({ name: b.mon.name, role: one(b.mon.role?.label, 'en'), keep: b.mon.moves.filter((_, i) => !b.idx.includes(i)).map(m => m.name.en), badMoves: b.idx.map(i => b.mon.moves[i].name.en), digest: learnsetDigest(b.p) }));
      try {
        const { json } = await askJSON(cfg, repairPrompt(g, key, items), { signal, useSearch: false, sampleFn: claudeSample, onAttempt: (l) => setGen(g.id, s => ({ ...s, attempt: l })) });
        for (const fx of json?.fixes || []) {
          const b = bads.find(x => normKey(x.mon.name) === normKey(fx.name)); if (!b) continue;
          const i = b.mon.moves.findIndex(m => normKey(m.name.en) === normKey(fx.replace)); if (i < 0 || !fx.with) continue;
          b.mon.moves[i] = { name: asT(fx.with) || { vi: fx.with.en, en: fx.with.en }, type: asType(fx.type), method: { k: 'other', v: '' } };
        }
        for (const b of bads) { try { await verifyMon(b.mon, g, signal); } catch (e) { if (e.code === 'cancelled') throw e; } }
      } catch (e) { if (e.code === 'cancelled') throw e; }
    }
    return team;
  };

  const runPhase = async (g, key, signal, research) => {
    const cur = dataRef.current[g.id]; const ph = cur?.phases?.[key]; if (!ph) return;
    step(g.id, key, 'run');
    try {
      const ctx = research?.length ? `\n\nWEB RESEARCH (snippets from Bulbapedia/Serebii/PokémonDB — prefer these over memory when they disagree):\n${research.map(r => `- ${r.title}: ${r.content}`).join('\n').slice(0, 6000)}` : '';
      const { json, sources, used } = await askJSON(cfg, phasePrompt(g, key, ph) + ctx, { signal, sampleFn: claudeSample, onAttempt: (l) => setGen(g.id, s => ({ ...s, attempt: l })) });
      const arr = Array.isArray(json) ? json : Array.isArray(json?.team) ? json.team : null;
      if (!arr?.length) throw new LLMError('bad_shape', 'no team');
      let team = arr.slice(0, 6).map(normMon);
      step(g.id, key, 'verify');
      team = await verifyTeam(g, team, key, signal, true);
      const d = dataRef.current[g.id];
      putData(g.id, { ...d, sources: mergeSources(d.sources, sources), phases: { ...d.phases, [key]: { ...d.phases[key], team } } });
      const ok = team.reduce((s, m) => s + (m.verify?.moves || []).filter(x => x === 'ok').length, 0), all = team.reduce((s, m) => s + (m.moves || []).length, 0);
      step(g.id, key, 'done', `✓ ${ok}/${all} · ${String(used || '').replace(/^\w+ · /, '')}`);
    } catch (e) {
      step(g.id, key, 'err'); if (e.code !== 'cancelled') setGen(g.id, s => ({ ...s, error: errCopy(e) }));
    }
  };

  const generate = async (g, { onlyMissing = false } = {}) => {
    if (!cfgReady(cfg)) { setCfgOpen(true); return; }
    (ctlRef.current[g.id] || []).forEach(c => c.abort());
    const ctl = new AbortController(); ctlRef.current[g.id] = [ctl]; const signal = ctl.signal;
    setGens(s => ({ ...s, [g.id]: { provider: providerLabel(cfg), steps:{ research:'wait', plan:'wait', early:'wait', mid:'wait', end:'wait' }, info:{}, error:'' } }));
    /* 1. research */
    let research = [];
    if (cfg.tavilyKey) {
      step(g.id, 'research', 'run');
      try {
        const qs = [`Pokémon ${g.name} gym leaders teams levels walkthrough`, `Pokémon ${g.name} best in-game team ${g.starter ? 'with ' + g.starter : 'catchable early'}`];
        const res = await Promise.all(qs.map(q => tavilySearch(cfg.tavilyKey, q, signal).catch(e => { if (e.code === 'cancelled') throw e; return []; })));
        research = res.flat(); step(g.id, 'research', research.length ? 'done' : 'err', research.length ? `${research.length}` : '');
        if (!research.length) setGen(g.id, s => ({ ...s, error: '' }));
      } catch (e) { if (e.code === 'cancelled') { step(g.id, 'research', 'err'); return; } step(g.id, 'research', 'err'); }
    } else step(g.id, 'research', 'skip');
    /* 2. plan */
    let d = onlyMissing ? dataRef.current[g.id] : null;
    if (!d?.phases?.early?.roster?.length) {
      step(g.id, 'plan', 'run');
      try {
        const ctx = research.length ? `\n\nWEB RESEARCH (snippets — prefer these over memory when they disagree):\n${research.map(r => `- ${r.title} (${r.url}): ${r.content}`).join('\n').slice(0, 9000)}` : '';
        const { json: plan, sources, note, used } = await askJSON(cfg, planPrompt(g) + ctx, { signal, sampleFn: claudeSample, onAttempt: (l) => setGen(g.id, s => ({ ...s, attempt: l })) });
        if (!plan?.phases || !PHASES.every(k => plan.phases[k]?.roster?.length)) throw new LLMError('bad_shape', 'plan');
        d = { ai: true, provider: used || providerLabel(cfg), generatedAt: new Date().toISOString(), notes: asT(plan.notes), searchNote: note,
          sources: mergeSources(research.map(r => ({ title: r.title, url: r.url })), sources), phases: {} };
        PHASES.forEach(k => d.phases[k] = normPlanPhase(plan.phases[k]));
        putData(g.id, d); step(g.id, 'plan', 'done', String(used || '').replace(/^\w+ · /, ''));
      } catch (e) { step(g.id, 'plan', 'err'); if (e.code !== 'cancelled') setGen(g.id, s => ({ ...s, error: errCopy(e) })); return; }
    } else step(g.id, 'plan', 'done');
    /* 3. phases — sequential to respect free-tier rate limits, current tab first */
    const todo = PHASES.filter(k => !(onlyMissing && d.phases[k]?.team?.length));
    PHASES.filter(k => !todo.includes(k)).forEach(k => step(g.id, k, 'done'));
    for (const k of [phase, ...todo.filter(x => x !== phase)].filter(x => todo.includes(x))) {
      if (signal.aborted) break;
      await runPhase(g, k, signal, research);
    }
  };

  /* re-verify current data (works for built-in Platinum and imports too) */
  const verifyAll = async () => {
    const base = data; if (!base) return;
    setVerifying(true);
    const ctl = new AbortController(); ctlRef.current[dk] = [ctl];
    try {
      const d = clone(base);
      for (const k of PHASES) if (d.phases[k]?.team?.length) d.phases[k].team = await verifyTeam(job, d.phases[k].team, k, ctl.signal, !!d.ai);
      putData(dk, d);
    } catch (e) { if (e.code !== 'cancelled') setToast(t.paOffline); }
    setVerifying(false);
  };

  useEffect(() => {
    if (builtin || needsPick || !cfgReady(cfg)) return;
    const d = dataRef.current[dk];
    const incomplete = d?.phases && PHASES.some(k => !d.phases[k]?.team?.length);
    if ((!d || incomplete) && !gens[dk] && !autoStarted.current[dk]) { autoStarted.current[dk] = true; generate(job, { onlyMissing: !!incomplete }); }
  }, [dk, cfg]);

  const stop = () => (ctlRef.current[dk] || []).forEach(c => c.abort());
  const retry = () => generate(job, { onlyMissing: true });
  const regenerate = () => { dropData(dk); generate(job); };
  const saveCfg = (c) => { delete SEARCH_REFUSED.gemini; delete SEARCH_REFUSED.groq; setCfg(c); lsSet(LS_CFG, c); askPersist(); setCfgOpen(false); autoStarted.current = {}; };
  const saveGame = (g) => { setCustomGames(cg => [...cg, g]); setModal(false); setGameId(g.id); setPhase('early'); };
  const removeGame = () => { if (!armRemove) { setArmRemove(true); return; } stop(); Object.keys(dataRef.current).filter(k => k === game.id || k.startsWith(game.id + '::')).forEach(dropData); setCustomGames(cg => cg.filter(g => g.id !== game.id)); setGameId('platinum'); };
  const exportJson = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ game, starter: chosen || null, ...data }, null, 2)], { type: 'application/json' })); a.download = `${game.id}${chosen ? '-' + normKey(chosen) : ''}-walkthrough.json`; a.click(); };
  const onImport = (e) => {
    const file = e.target.files?.[0]; if (!file) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.phases) throw 0;
      const nd = { ai: !!d.ai, provider: d.provider, generatedAt: d.generatedAt || new Date().toISOString(), notes: asT(d.notes), sources: d.sources || [], phases: {} };
      PHASES.forEach(k => { const p = normPlanPhase(d.phases[k]); p.team = (d.phases[k]?.team || []).map(m => ({ ...normMon(m), verify: m.verify })); if (!p.roster.length) p.roster = p.team.map(m => ({ name:m.name, dex:m.dex, types:m.types })); nd.phases[k] = p; });
      putData(dk, nd); setToast(t.imported); } catch { setToast(t.badJson); } };
    r.readAsText(file); e.target.value = '';
  };

  const groups = useMemo(() => { const m = new Map(); allGames.forEach(g => { const k = g.custom ? 'custom' : g.gen; if (!m.has(k)) m.set(k, []); m.get(k).push(g); }); return [...m.entries()]; }, [allGames]);
  const ph = data?.phases?.[phase];
  const running = gen && Object.values(gen.steps).some(s => s === 'run' || s === 'verify');
  const showPanel = gen && !builtin && (running || Object.values(gen.steps).some(s => s === 'err'));
  const phaseLabel = (p) => (!builtin && data?.phases?.[p]?.label) ? one(data.phases[p].label, lang) : t.phaseSub[p];

  return (
    <div className="max-w-[1320px] mx-auto pb-16">
      <header className="pt-6 sm:pt-10 pb-6">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-12 h-12 rounded-full brutal-sm relative overflow-hidden shrink-0" aria-hidden="true">
              <div className="absolute inset-x-0 top-0 h-1/2 bg-[#ff3b3b]" /><div className="absolute inset-x-0 bottom-0 h-1/2 bg-white" />
              <div className="absolute inset-x-0 top-1/2 -translate-y-1/2 h-[3px] bg-[#0b0b0f]" />
              <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-white border-[3px] border-[#0b0b0f]" />
            </div>
            <div className="min-w-0">
              <div className="text-[11px] font-extrabold tracking-[.22em] uppercase text-[var(--accent)]">Pokémon</div>
              <h1 className="text-2xl sm:text-4xl font-black tracking-tight leading-none" style={{ textWrap: 'balance' }}>{t.title}</h1>
            </div>
          </div>
          <div className="flex gap-2 items-center">
            <button onClick={() => setCfgOpen(true)} className="brutal-sm brutal-btn rounded-xl px-3 py-2 font-bold text-sm bg-[#0e1018] flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${cfgReady(cfg) ? 'bg-[#7ff0a3]' : 'bg-[#ff9a9a]'}`} />{t.openCfg}
            </button>
            <div className="brutal-sm rounded-xl p-1 flex gap-1 bg-[#0e1018]" role="group" aria-label="Language">
              {['en', 'vi'].map(l => <button key={l} onClick={() => setLang(l)} aria-pressed={lang === l} className={`px-3.5 py-1.5 rounded-lg font-black text-sm transition-colors ${lang === l ? 'tab-active' : 'text-white/70 hover:text-white'}`}>{l.toUpperCase()}</button>)}
            </div>
          </div>
        </div>
        <p className="text-[var(--muted)] mt-3 max-w-2xl text-[15px]">{t.subtitle}</p>
      </header>

      <section className="glass brutal rounded-2xl p-4 sm:p-5 grid gap-4 lg:grid-cols-[minmax(0,1fr)_auto] items-end">
        <label className="grid gap-1.5 min-w-0">
          <span className="text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--muted)]">{t.game}</span>
          <select id="game-select" value={game.id} onChange={e => setGameId(e.target.value)} className="w-full rounded-xl px-3.5 py-3 border-2 border-white/80 font-bold text-[15px] focus:outline-none focus:border-[var(--accent)]">
            {groups.map(([g, list]) => (
              <optgroup key={g} label={g === 'custom' ? `★ ${t.custom}` : `Generation ${g}`}>
                {list.map(x => <option key={x.id} value={x.id}>{`Pokémon ${x.name} (${x.year || '?'})${BUILTIN_DATA[x.id] ? '  ✓' : Object.keys(dataMap).some(k => k === x.id || k.startsWith(x.id + '::')) ? '  ✦' : ''}`}</option>)}
              </optgroup>
            ))}
          </select>
        </label>
        <div className="flex flex-wrap gap-2.5">
          <button onClick={() => setModal(true)} className="brutal-sm brutal-btn rounded-xl px-4 py-3 font-black bg-[var(--accent)] text-[#0b0b0f] flex items-center gap-2"><Icon d={IC.plus} />{t.addGame}</button>
          {data ? <button onClick={exportJson} className="brutal-sm brutal-btn rounded-xl px-4 py-3 font-bold bg-[#0e1018] flex items-center gap-2"><Icon d={IC.down} />{t.exportJson}</button> : null}
          <button onClick={() => fileRef.current?.click()} className="brutal-sm brutal-btn rounded-xl px-4 py-3 font-bold bg-[#0e1018] flex items-center gap-2"><Icon d={IC.up} />{t.importJson}</button>
        </div>
        <div className="lg:col-span-2 flex flex-wrap gap-2 items-center">
          <span className="chip bg-white/10">{t.gen} {game.gen}</span><span className="chip bg-white/10">{game.region}</span><span className="chip bg-white/10">{game.year}</span>
          {game.custom ? <span className="chip" style={{ background:'#3d2b0e', color:'#ffcf7a' }}>★ {t.custom}</span> : null}
          {chosen ? <span className="chip bg-white/10">{t.starterChip}: {chosen}</span> : null}
          {builtin && !dataMap[dk] ? <span className="chip" style={{ background:'#163a24', color:'#7ff0a3' }}>✓ {t.builtIn}</span> : data?.ai ? <span className="chip" style={{ background:'#2c1a4a', color:'#c6a6ff' }}>✦ {t.aiBadge}{data.provider ? ` · ${data.provider}` : ''}</span> : null}
          {data?.ai && data.generatedAt ? <span className="chip bg-white/5 text-[var(--muted)]">{t.generatedAt} {new Date(data.generatedAt).toLocaleDateString(lang === 'vi' ? 'vi-VN' : 'en-US')}</span> : null}
          <span className="flex-1" />
          {data && !needsPick && GAME_PA[game.id] && !running ? <button onClick={verifyAll} disabled={verifying} className="text-[13px] font-bold text-[#8db8ff] hover:text-white inline-flex items-center gap-1.5 disabled:opacity-60"><Icon d={IC.check} className="w-3.5 h-3.5" />{verifying ? t.verifying : t.verifyBtn}</button> : null}
          {!builtin && data && cfgReady(cfg) && !running ? <button onClick={regenerate} className="text-[13px] font-bold text-[#c6a6ff] hover:text-white inline-flex items-center gap-1.5"><Icon d={IC.refresh} className="w-3.5 h-3.5" />{t.regenerate}</button> : null}
          {game.custom ? <button onClick={removeGame} className="text-[13px] font-bold text-red-300 hover:text-red-200 inline-flex items-center gap-1.5"><Icon d={IC.trash} className="w-3.5 h-3.5" />{armRemove ? t.confirmRemove : t.remove}</button> : null}
        </div>
      </section>

      {starterList.length > 1 ? <StarterPicker list={starterList} value={starter} onPick={pickStarter} cached={cachedStarter} t={t} lang={lang} /> : null}

      <nav className="mt-6 grid grid-cols-3 gap-2 sm:gap-3" role="tablist">
        {PHASES.map((p, i) => (
          <button key={p} role="tab" aria-selected={phase === p} onClick={() => setPhase(p)} className={`brutal-sm brutal-btn rounded-2xl px-2 sm:px-4 py-3 text-left transition-colors min-w-0 ${phase === p ? 'tab-active' : 'bg-[#0e1018] text-white/85'}`}>
            <div className="flex items-center gap-2"><span className={`dex-num text-[11px] font-bold ${phase === p ? 'text-black/60' : 'text-[var(--muted)]'}`}>0{i + 1}</span><span className="font-black text-[14px] sm:text-lg leading-tight">{t.phases[p]}</span></div>
            <div className={`text-[11px] sm:text-[12.5px] mt-0.5 truncate ${phase === p ? 'text-black/70' : 'text-[var(--muted)]'}`}>{phaseLabel(p)}</div>
          </button>
        ))}
      </nav>

      {!storageWorks ? <div className="mt-6 rounded-2xl p-4 border-2 border-[#9a3a3a] bg-[#3d1717]/60 text-[13.5px] leading-relaxed"><span className="font-black text-[#ff9a9a]">⚠ </span>{t.storageOff}</div> : null}

      {showPanel ? <GenPanel gen={gen} t={t} onStop={stop} onRetry={retry} /> : null}

      {ph ? (
        <div key={dk + phase} className="fade-in">
          {data.ai ? <p className="mt-6 text-[13px] text-[#c6a6ff] border-l-4 border-[#6a49b0] pl-3 leading-relaxed">{t.aiDisclaimer}{data.searchNote === 'search_off' ? ' ' + t.searchOff : ''}{data.notes && one(data.notes, lang) ? ' ' + one(data.notes, lang) : ''}</p> : null}
          <section className="mt-6 grid gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.6fr)]">
            <div className="glass rounded-2xl p-5 border-2 border-white/15 flex flex-col gap-4 min-w-0">
              <div><div className="text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--accent)]">{t.strategy}</div><p className="mt-2 text-[14.5px] leading-relaxed text-white/90">{one(ph.tip, lang)}</p></div>
              <div className="flex flex-wrap gap-2">
                {ph.levelRange ? <div className="chip bg-white/10 text-[12px]">{t.levels}: {ph.levelRange}</div> : null}
                <div className="chip bg-white/10 text-[12px]">{t.team}: {(ph.team?.length || ph.roster?.length || 0)} {t.mons}</div>
              </div>
              <Coverage team={ph.team?.length ? ph.team : (ph.roster || [])} lang={lang} t={t} />
            </div>
            <div className="min-w-0">
              <div className="flex items-center gap-2 text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--muted)] mb-2.5"><Icon d={IC.trophy} className="w-3.5 h-3.5" />{t.keyBattles}</div>
              <BattleStrip battles={ph.battles || []} lang={lang} t={t} />
            </div>
          </section>
          <section className="mt-8 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 stagger">
            {ph.team?.length ? ph.team.map((m, i) => <PokemonCard key={m.name + i} mon={m} lang={lang} t={t} />) : (ph.roster || []).map((r, i) => <SkeletonCard key={r.name + i} r={r} lang={lang} />)}
          </section>
          {ph.mascot ? (
            <section className="mt-8 rounded-2xl p-4 sm:p-5 border-2 border-dashed flex gap-4 items-center glass" style={{ borderColor: `${tc(ph.mascot.types?.[0])}aa` }}>
              <img src={spriteUrl(ph.mascot.dex)} alt="" className="w-20 h-20 object-contain shrink-0" onError={e => e.currentTarget.style.display='none'} />
              <div className="min-w-0">
                <div className="text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--muted)]">{t.mascot}</div>
                <div className="flex items-center gap-2 flex-wrap mt-0.5"><span className="font-black text-lg">{ph.mascot.name}</span>{(ph.mascot.types||[]).map(ty => <TypeBadge key={ty} type={ty} lang={lang} small />)}</div>
                <p className="text-[13px] text-white/75 mt-1 leading-relaxed">{one(ph.mascot.note, lang)}</p>
              </div>
            </section>
          ) : null}
          {data.sources?.length ? (
            <section className="mt-8">
              <div className="text-[11px] uppercase tracking-[.14em] font-extrabold text-[var(--muted)] mb-2">{t.sources}</div>
              <ul className="grid gap-1 text-[13px] sm:grid-cols-2">{data.sources.slice(0, 12).map((s, i) => <li key={i} className="min-w-0 truncate"><a className="text-[#8db8ff] hover:underline" href={s.url} target="_blank" rel="noopener">{s.title || s.url}</a></li>)}</ul>
            </section>
          ) : null}
        </div>
      ) : !showPanel ? (
        <section className="mt-6 glass rounded-2xl border-2 border-dashed border-white/40 p-8 sm:p-12 text-center fade-in">
          {needsPick ? (<>
            <h2 className="text-xl sm:text-2xl font-black">{t.pickFirst}</h2>
            <p className="text-[var(--muted)] mt-2 max-w-xl mx-auto">{t.pickFirstSub}</p>
          </>) : !cfgReady(cfg) ? (<>
            <h2 className="text-xl sm:text-2xl font-black">{t.needCfg}</h2>
            <p className="text-[var(--muted)] mt-2 max-w-xl mx-auto">{t.needCfgSub}</p>
            <div className="flex flex-wrap gap-3 justify-center mt-6">
              <button onClick={() => setCfgOpen(true)} className="brutal-sm brutal-btn rounded-xl px-5 py-3 font-black bg-[var(--accent)] text-[#0b0b0f]">{t.openCfg}</button>
              <button onClick={() => setGameId('platinum')} className="rounded-xl px-4 py-3 font-bold border-2 border-white/30 hover:bg-white/5">Pokémon Platinum</button>
            </div>
          </>) : (<>
            <h2 className="text-xl sm:text-2xl font-black">{t.idleTitle}</h2>
            <p className="text-[var(--muted)] mt-2 max-w-xl mx-auto">{t.idleSub}</p>
            {gen?.error ? <p className="mt-3 text-[13.5px] font-semibold text-red-300">{gen.error}</p> : null}
            <button onClick={() => generate(job)} className="mt-6 brutal-sm brutal-btn rounded-xl px-5 py-3 font-black bg-[var(--accent)] text-[#0b0b0f] inline-flex items-center gap-2"><Icon d={IC.wand} />{t.startGen}</button>
          </>)}
        </section>
      ) : null}

      <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={onImport} />
      <AddGameModal open={modal} onClose={() => setModal(false)} onSave={saveGame} t={t} />
      <SettingsModal open={cfgOpen} onClose={() => setCfgOpen(false)} cfg={cfg} onSave={saveCfg} t={t} claudeAvailable={!!claudeSample} />
      {toast ? <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 brutal-sm rounded-xl px-4 py-2.5 bg-[var(--accent)] text-[#0b0b0f] font-bold fade-in">{toast}</div> : null}
      <footer className="mt-14 pt-6 border-t border-white/10 text-[12px] text-[var(--muted)] leading-relaxed">
        <p>{t.footer}</p><p className="mt-1">Pokémon © Nintendo / Game Freak / Creatures. Fan-made tool, not affiliated.</p>
      </footer>
    </div>
  );
}
function mergeSources(a, b) { const out = [], seen = new Set(); [...(a || []), ...(b || [])].forEach(s => { if (s?.url && !seen.has(s.url)) { seen.add(s.url); out.push(s); } }); return out; }

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
